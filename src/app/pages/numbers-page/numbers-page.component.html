<section class="ml-5">
    <h1 class="text-2xl font-bold">Numbers Pipes</h1>
    <h3 class="text-lg font-thin">Number pipes included in <strong>Angular</strong></h3>
</section>
<div class="stats stats-vertical lg:stats-horizontal shadow w-full">
  <div class="stat">
    <div class="stat-title">Number Pipe</div>
    <div class="stat-value">{{totalSells() | number: '1.1-2'}}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Percent Pipe</div>
    <div class="stat-value">{{percent() | percent: '1.2-2'}}</div>
    <div class="stat-desc">{{percent()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Currency Pipe</div>
    <div class="stat-value">{{totalSells() | currency:'COP':'symbol-narrow': '1.2-2'}}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>
</div>
