<section class="mx-5">
    <h1 class="text-2xl font-bold">Custom Pipes</h1>
    <h3 class="text-lg font-thin">Pipes no included in <strong>Angular</strong></h3>
</section>

<div class="stats shadow">
    <div class="stat">
        <div class="stat-title">ToggleCasePipe</div>
        <div class="stat-value">{{name() | toggleCase:upper()}}</div>
        <div class="stat-desc">{{name()}}</div>

        <button class="btn btn-primary" (click)="upper.set(!upper())">
            ToggleCase
        </button>
    </div>
</div>
